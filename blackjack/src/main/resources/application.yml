spring:
  profiles:
    default: local
  flyway:
    enabled: false
  application:
    name: blackjack
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
server:
  port: ${PORT:8080}
app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  oauth-enabled: false
jwt:
  access-expiration: 1800000
  refresh-expiration: 604800000

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
server.error.include-message: never
server.error.include-stacktrace: never
